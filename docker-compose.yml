services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: chat-backend

    ports:
      - "5001:5000"

    env_file:
      - .env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: chat-frontend

    ports:
      - "3000:3000"

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    stdin_open: true
    tty: true

    depends_on:
      - backend